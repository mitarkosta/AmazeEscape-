<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff27a"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b88600"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3030"/>
      <stop offset="100%" stop-color="#700000"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="512" height="512" rx="100" fill="#080808"/>

  <!-- светещ ореол -->
  <circle cx="256" cy="240" r="210" fill="#660000" opacity="0.5"/>

  <!-- казино машина -->
  <rect x="95" y="80" width="322" height="350" rx="45"
        fill="url(#gold)" stroke="#fff2a0" stroke-width="8"/>

  <!-- горна част -->
  <rect x="125" y="120" width="262" height="80" rx="20"
        fill="#111" stroke="#ffd700" stroke-width="6"/>

  <!-- барабани -->
  <rect x="130" y="220" width="252" height="120" rx="20"
        fill="#222"/>

  <rect x="150" y="240" width="60" height="80" rx="10" fill="white"/>
  <rect x="226" y="240" width="60" height="80" rx="10" fill="white"/>
  <rect x="302" y="240" width="60" height="80" rx="10" fill="white"/>

  <!-- символи -->
  <text x="180" y="295" font-size="45" text-anchor="middle">🍒</text>
  <text x="256" y="295" font-size="45" text-anchor="middle">⭐</text>
  <text x="332" y="295" font-size="45" text-anchor="middle">7️⃣</text>

  <!-- лост -->
  <rect x="395" y="170" width="15" height="100" fill="#222"/>
  <circle cx="403" cy="150" r="25" fill="url(#red)" stroke="#ffd700" stroke-width="5"/>

  <!-- копче -->
  <circle cx="256" cy="380" r="25" fill="#ff0000" stroke="#ffd700" stroke-width="6"/>

  <!-- име -->
  <text x="256" y="105" fill="#fff" font-size="28"
        text-anchor="middle" font-family="Arial">
    JACKPOT
  </text>
</svg>
