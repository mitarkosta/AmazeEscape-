<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AmazeEscape</title>


<link rel="icon" href="favicon.svg">


<link rel="stylesheet" href="css/amaze-style.css">


</head>


<body>



<main class="machine">


    <div class="machine-header">


        <h1>
            AmazeEscape
        </h1>


        <div class="subtitle">
            ESCAPE THE JACKPOT MAZE
        </div>


    </div>





    <section class="cabinet">


        <div class="display">


            <div class="slots">


                <div 
                class="slot reel-stop" 
                id="slot1">
                    🍒
                </div>



                <div 
                class="slot reel-stop" 
                id="slot2">
                    🍋
                </div>



                <div 
                class="slot reel-stop" 
                id="slot3">
                    ⭐
                </div>


            </div>


        </div>


    </section>







    <div class="controls">


        <button id="button">

            🎰 SPIN

        </button>


    </div>







    <div 
    id="message" 
    class="message">

        READY

    </div>






    <div 
    id="counter" 
    class="counter">

        Attempts: 0

    </div>





</main>





<script src="js/amaze-engine.js"></script>


</body>

</html>
