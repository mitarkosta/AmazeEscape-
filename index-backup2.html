<!DOCTYPE html>

<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmazeEscape</title>

<link rel="stylesheet" href="css/amaze-style.css">

</head>

<body>

<div class="casino-background"></div>

<div class="machine">

<div class="machine-header">

<h1>
AmazeEscape
</h1>

<div class="subtitle">
ESCAPE THE JACKPOT MAZE
</div>

</div>

<div class="cabinet">

<div class="display">

<div class="slots">

<div class="slots">

    <div class="slot" id="slot1">
        🍒
    </div>

    <div class="slot" id="slot2">
        ⭐
    </div>

    <div class="slot" id="slot3">
        💎
    </div>

</div>
</div>

</div>

</div>

🎰 SPIN

</button>

<div id="message">

Ready...

</div>

<div id="counter">

</div>

</div>

<div class="lever" id="lever">

</div>

<div class="jackpot-lamp" id="jackpotLamp"></div>

</div>

<link rel="stylesheet" href="css/amaze-style.css">

<script src="js/amaze-engine.js"></script>
