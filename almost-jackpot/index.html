<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at center,#700000,#050505 70%);
}


/* движещи се светлини */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(gold 2px,transparent 2px);

    background-size:50px 50px;
    opacity:.15;

    animation:stars 15s linear infinite;
}


@keyframes stars{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(100px);
    }
}



/* машина */

.machine{

    position:relative;
    z-index:2;

    width:90%;
    max-width:520px;

    padding:35px;

    text-align:center;

    background:
    linear-gradient(#222,#050505);

    border:5px solid gold;
    border-radius:30px;

    box-shadow:
    0 0 30px gold,
    0 0 80px orange;

}


.shake{
    animation:shake .4s;
}


@keyframes shake{

20%{
transform:translateX(-15px);
}

40%{
transform:translateX(15px);
}

60%{
transform:translateX(-10px);
}

80%{
transform:translateX(10px);
}

}



/* заглавие */


h1{

font-size:55px;

color:#ffd700;

letter-spacing:5px;

text-shadow:
0 0 10px gold,
0 0 40px orange;

animation:glow 1.5s infinite alternate;

}



@keyframes glow{

from{
filter:brightness(1);
}

to{
filter:brightness(1.5);
}

}



.subtitle{

margin-top:10px;

color:white;

letter-spacing:5px;

}



/* дисплей */

.display{

margin-top:30px;

padding:25px;

background:black;

border-radius:20px;

border:3px solid #555;

box-shadow:
inset 0 0 20px black,
0 0 20px gold;

}



/* барабани */

.slots{

display:flex;

justify-content:center;

gap:15px;

margin:20px 0;

}



.slot{

width:90px;
height:90px;

display:flex;

justify-content:center;
align-items:center;

font-size:50px;

background:#222;

border:3px solid gold;

border-radius:15px;

box-shadow:
inset 0 0 20px black,
0 0 15px gold;

}



.spin{

animation:spin .12s infinite;

}


@keyframes spin{

50%{
transform:translateY(15px);
}

}



/* бутон */


button{

margin-top:25px;

padding:18px 50px;

font-size:25px;

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

background:
linear-gradient(#ffe066,#cc9900);

box-shadow:
0 0 25px gold;

}


button:hover{

transform:scale(1.08);

}


button:disabled{

opacity:.5;

}



/* текстове */


#message{

margin-top:25px;

font-size:30px;

font-weight:bold;

color:white;

}



#attempt{

margin-top:15px;

color:#aaa;

}



.jackpot{

animation:jackpot .8s infinite;

}


@keyframes jackpot{

50%{
transform:scale(1.2);
}

}



/* конфети */

.confetti{

position:absolute;

width:10px;

height:20px;

top:-20px;

animation:fall 3s linear forwards;

}


@keyframes fall{

to{

transform:
translateY(110vh)
rotate(720deg);

}

}


</style>

</head>


<body>


<div class="machine" id="machine">


<h1>
JACKPOT
</h1>


<div class="subtitle">
TRY YOUR LUCK
</div>


<div class="display">


<div class="slots">

<div class="slot" id="s1">🍒</div>

<div class="slot" id="s2">⭐</div>

<div class="slot" id="s3">💎</div>

</div>


</div>


<button id="spinButton">
🎰 SPIN
</button>


<div id="message">
Almost...
</div>


<div id="attempt">
Attempt: 0
</div>


</div>



<script>


const symbols=[

"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"

];


let attempts=0;


const s1=document.getElementById("s1");
const s2=document.getElementById("s2");
const s3=document.getElementById("s3");

const button=document.getElementById("spinButton");

const message=document.getElementById("message");

const attempt=document.getElementById("attempt");

const machine=document.getElementById("machine");



function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}




/* звук */


function sound(type){

let audio=new AudioContext();

let osc=audio.createOscillator();

let gain=audio.createGain();


osc.connect(gain);

gain.connect(audio.destination);



if(type==="spin"){

osc.frequency.value=200;

gain.gain.value=.05;

}


if(type==="win"){

osc.frequency.value=800;

gain.gain.value=.1;

}


if(type==="near"){

osc.frequency.value=500;

gain.gain.value=.08;

}



osc.start();

osc.stop(audio.currentTime+.3);

}




function spin(){


attempts++;

attempt.innerHTML=
"Attempt: "+attempts;


button.disabled=true;


machine.classList.add("shake");


sound("spin");


let slots=[
s1,s2,s3
];


slots.forEach(slot=>{

slot.classList.add("spin");

});



let counter=0;


let timer=setInterval(()=>{


slots.forEach(slot=>{

slot.innerHTML=randomSymbol();

});


counter++;



if(counter>20){


clearInterval(timer);


slots.forEach(slot=>{

slot.classList.remove("spin");

});


finish(slots);


}


},100);



}




function finish(slots){


let result=
slots.map(
x=>x.innerHTML
);



machine.classList.remove("shake");



if(
result[0]===result[1] &&
result[1]===result[2]
){

message.innerHTML=
"🎉 JACKPOT! 🎉";


message.classList.add("jackpot");


sound("win");


confetti();


}


else if(

result[0]===result[1] ||
result[1]===result[2] ||
result[0]===result[2]

){


message.innerHTML=
"🔥 ALMOST WIN!";


sound("near");


}


else{


let texts=[

"Almost...",
"Very close!",
"Next one!",
"Try again",
"So near..."

];


message.innerHTML=
texts[
Math.floor(Math.random()*texts.length)
];


}



button.disabled=false;


}




function confetti(){


for(let i=0;i<100;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=
[
"gold",
"red",
"blue",
"green"
]
[
Math.floor(Math.random()*4)
];


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}


}



button.onclick=spin;


</script>


</body>
</html>
