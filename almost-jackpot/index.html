<!DOCTYPE html>
<html lang="bg">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle,#650000,#050505 75%);
}


/* фон */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    radial-gradient(gold 2px,transparent 2px);

    background-size:45px 45px;

    opacity:.15;

    animation:moveStars 15s linear infinite;

}


@keyframes moveStars{

from{
transform:translateY(0);
}

to{
transform:translateY(100px);
}

}



/* машина */


.machine{

    position:relative;

    z-index:2;

    width:90%;
    max-width:520px;

    padding:35px;

    background:
    linear-gradient(#222,#050505);

    border:5px solid gold;

    border-radius:30px;

    text-align:center;

    box-shadow:

    0 0 30px gold,
    0 0 80px orange;

}



.shake{

animation:shake .4s;

}


@keyframes shake{

0%{
transform:translateX(0);
}

25%{
transform:translateX(-15px);
}

50%{
transform:translateX(15px);
}

75%{
transform:translateX(-10px);
}

100%{
transform:translateX(0);
}

}




h1{

font-size:55px;

color:#ffd700;

letter-spacing:5px;

text-shadow:
0 0 10px gold,
0 0 40px orange;

}



.subtitle{

color:white;

margin-top:10px;

letter-spacing:5px;

}



/* екран */


.display{

margin-top:30px;

padding:25px;

background:black;

border:3px solid #555;

border-radius:20px;

box-shadow:
inset 0 0 20px black,
0 0 20px gold;

}



.slots{

display:flex;

justify-content:center;

gap:15px;

}



.slot{

width:90px;

height:90px;

background:#222;

border:3px solid gold;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

box-shadow:
inset 0 0 20px black;

}



.running{

animation:rolling .12s infinite;

}



@keyframes rolling{

50%{

transform:translateY(15px);

}

}




button{

margin-top:30px;

padding:18px 50px;

font-size:25px;

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

background:
linear-gradient(#ffe066,#cc9900);

box-shadow:
0 0 25px gold;

}



button:disabled{

opacity:.5;

}



#message{

margin-top:25px;

font-size:30px;

font-weight:bold;

color:white;

}



#attempt{

margin-top:10px;

color:#aaa;

}



.win{

animation:win .8s infinite;

}


@keyframes win{

50%{

transform:scale(1.2);

}

}




.confetti{

position:absolute;

width:10px;

height:20px;

top:-20px;

animation:drop 3s linear forwards;

}



@keyframes drop{

to{

transform:
translateY(110vh)
rotate(720deg);

}

}


</style>


</head>


<body>



<div class="machine" id="machine">


<h1>
JACKPOT
</h1>


<div class="subtitle">
TRY YOUR LUCK
</div>



<div class="display">


<div class="slots">


<div class="slot" id="one">
🍒
</div>


<div class="slot" id="two">
⭐
</div>


<div class="slot" id="three">
💎
</div>


</div>


</div>



<button id="spin">
🎰 SPIN
</button>



<div id="message">
Almost...
</div>



<div id="attempt">
Attempt: 0
</div>


</div>



<script>


const symbols=[

"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"

];


const one=document.getElementById("one");
const two=document.getElementById("two");
const three=document.getElementById("three");

const button=document.getElementById("spin");

const message=document.getElementById("message");

const machine=document.getElementById("machine");

const attemptText=document.getElementById("attempt");


let attempts=0;



let audio;



function startAudio(){


if(!audio){

audio=new AudioContext();

}


}



function beep(freq,time){


startAudio();


let osc=audio.createOscillator();

let gain=audio.createGain();


osc.frequency.value=freq;

gain.gain.value=.08;


osc.connect(gain);

gain.connect(audio.destination);


osc.start();

osc.stop(audio.currentTime+time);


}



function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}




function spin(){


button.disabled=true;


attempts++;

attemptText.innerHTML=
"Attempt: "+attempts;


machine.classList.add("shake");


beep(200,.15);



let slots=[
one,
two,
three
];


slots.forEach(s=>{

s.classList.add("running");

});



let count=0;


let timer=setInterval(()=>{


slots.forEach(s=>{

s.innerHTML=randomSymbol();

});


count++;



if(count>=25){


clearInterval(timer);


stopSlots(slots);


}


},100);


}




function stopSlots(slots){


let results=[];


slots.forEach((slot,index)=>{


setTimeout(()=>{


slot.classList.remove("running");


slot.innerHTML=randomSymbol();


results[index]=slot.innerHTML;



if(index===2){

check(results);

}


},700+(index*500));


});


}



function check(r){



button.disabled=false;



if(
r[0]===r[1] &&
r[1]===r[2]
){


message.innerHTML=
"🎉 JACKPOT 🎉";


message.classList.add("win");


beep(900,.5);


confetti();


}

else if(

r[0]===r[1] ||
r[1]===r[2] ||
r[0]===r[2]

){


message.innerHTML=
"🔥 ALMOST WIN";


beep(500,.3);


}


else{


message.innerHTML=
"❌ Try again";


}



}




function confetti(){


for(let i=0;i<100;i++){


let c=document.createElement("div");

c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=
[
"gold",
"red",
"blue",
"green"
]
[
Math.floor(Math.random()*4)
];


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);


}


}



button.addEventListener(
"click",
spin
);



</script>


</body>
</html>
