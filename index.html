<!DOCTYPE html>
<html lang="bg">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="Amaze Gaming — Escape Engine v8"
    >

    <title>
        Amaze Gaming — Escape Engine v8
    </title>


    <!-- =====================================================
         AMAZE GAMING v8
         MAIN STYLE
    ====================================================== -->

    <link
        rel="stylesheet"
        href="amaze-style-v8.css"
    >

</head>


<body>


    <!-- =====================================================
         CASINO BACKGROUND
    ====================================================== -->

    <div
        id="casinoBackground"
        class="casino-background"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         SNOW / ICE EFFECT
    ====================================================== -->

    <div
        id="snowContainer"
        class="snow-container"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN GAME
    ====================================================== -->

    <main
        id="game"
        class="game"
    >


        <!-- ================================================
             HEADER
        ================================================= -->

        <header class="game-header">

            <div class="brand">

                <div class="brand-title">
                    AMAZE
                </div>

                <div class="brand-subtitle">
                    GAMING
                </div>

            </div>


            <div
                id="roundStatus"
                class="round-status"
            >
                ROUND 1
            </div>

        </header>



        <!-- ================================================
             MACHINE
        ================================================= -->

        <section
            id="machine"
            class="machine"
            aria-label="Amaze Gaming slot machine"
        >


            <!-- ============================================
                 JACKPOT LAMP
            ============================================= -->

            <div
                id="jackpotLamp"
                class="jackpot-lamp"
                aria-hidden="true"
            ></div>



            <!-- ============================================
                 MACHINE TOP
            ============================================= -->

            <div class="machine-top">

                <div class="machine-title">
                    AMAZE GAMING
                </div>

                <div class="machine-version">
                    ESCAPE ENGINE v8
                </div>

            </div>



            <!-- ============================================
                 REEL WINDOW
            ============================================= -->

            <div
                class="reel-window"
                aria-label="Slot reels"
            >


                <!-- ========================================
                     REEL 1
                ========================================= -->

                <div
                    class="reel-column"
                    data-reel="1"
                >

                    <div
                        id="slot1"
                        class="slot-reel"
                        aria-label="First reel"
                    >

                        <div class="reel-strip">

                            <div class="reel-symbol">
                                🍒
                            </div>

                            <div class="reel-symbol">
                                🍋
                            </div>

                            <div class="reel-symbol">
                                ⭐
                            </div>

                            <div class="reel-symbol">
                                💎
                            </div>

                            <div class="reel-symbol">
                                🔔
                            </div>

                            <div class="reel-symbol">
                                7️⃣
                            </div>

                        </div>

                    </div>

                </div>



                <!-- ========================================
                     METAL SEPARATOR 1
                ========================================= -->

                <div
                    class="reel-separator"
                    aria-hidden="true"
                >

                    <div class="separator-metal"></div>

                </div>



                <!-- ========================================
                     REEL 2
                ========================================= -->

                <div
                    class="reel-column"
                    data-reel="2"
                >

                    <div
                        id="slot2"
                        class="slot-reel"
                        aria-label="Second reel"
                    >

                        <div class="reel-strip">

                            <div class="reel-symbol">
                                🍒
                            </div>

                            <div class="reel-symbol">
                                🍋
                            </div>

                            <div class="reel-symbol">
                                ⭐
                            </div>

                            <div class="reel-symbol">
                                💎
                            </div>

                            <div class="reel-symbol">
                                🔔
                            </div>

                            <div class="reel-symbol">
                                7️⃣
                            </div>

                        </div>

                    </div>

                </div>



                <!-- ========================================
                     METAL SEPARATOR 2
                ========================================= -->

                <div
                    class="reel-separator"
                    aria-hidden="true"
                >

                    <div class="separator-metal"></div>

                </div>



                <!-- ========================================
                     REEL 3
                ========================================= -->

                <div
                    class="reel-column"
                    data-reel="3"
                >

                    <div
                        id="slot3"
                        class="slot-reel"
                        aria-label="Third reel"
                    >

                        <div class="reel-strip">

                            <div class="reel-symbol">
                                🍒
                            </div>

                            <div class="reel-symbol">
                                🍋
                            </div>

                            <div class="reel-symbol">
                                ⭐
                            </div>

                            <div class="reel-symbol">
                                💎
                            </div>

                            <div class="reel-symbol">
                                🔔
                            </div>

                            <div class="reel-symbol">
                                7️⃣
                            </div>

                        </div>

                    </div>

                </div>


            </div>



            <!-- ============================================
                 REEL CENTER LINE
            ============================================= -->

            <div
                class="reel-center-line"
                aria-hidden="true"
            ></div>



            <!-- ============================================
                 ANTICIPATION OVERLAY
            ============================================= -->

            <div
                id="anticipationOverlay"
                class="anticipation-overlay"
                aria-hidden="true"
            >

                <div class="anticipation-content">

                    <div class="anticipation-title">
                        🔥 FINAL REEL 🔥
                    </div>

                    <div class="anticipation-subtitle">
                        TWO MATCH
                    </div>

                </div>


                <div
                    id="anticipationParticles"
                    class="anticipation-particles"
                ></div>

            </div>



            <!-- ============================================
                 MACHINE MESSAGE
            ============================================= -->

            <div
                id="message"
                class="machine-message"
                aria-live="polite"
            >
                READY
            </div>



            <!-- ============================================
                 LEVER
            ============================================= -->

            <div class="lever-area">

                <div class="lever-base">

                    <div
                        class="real-lever"
                        role="button"
                        aria-label="Slot lever"
                    >

                        <div class="lever-arm"></div>

                        <div class="lever-ball"></div>

                    </div>

                </div>

            </div>



            <!-- ============================================
                 SPIN BUTTON
            ============================================= -->

            <button
                id="button"
                class="spin-button"
                type="button"
            >

                <span class="button-main">
                    SPIN
                </span>

                <span class="button-sub">
                    PLAY
                </span>

            </button>



            <!-- ============================================
                 SPIN PROGRESS
            ============================================= -->

            <div class="progress-section">

                <div class="progress-header">

                    <span>
                        SPINS
                    </span>

                    <span id="counterValue">
                        0 / 100
                    </span>

                </div>


                <div
                    id="spinProgress"
                    class="progress-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >

                    <div
                        id="spinProgressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>



            <!-- ============================================
                 PERSISTENT REWARD
            ============================================= -->

            <div class="persistent-section">

                <div class="persistent-header">

                    <span>
                        PERSISTENT REWARD
                    </span>

                    <span id="persistentValue">
                        0 / 10
                    </span>

                </div>


                <div
                    id="persistentBar"
                    class="persistent-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="10"
                    aria-valuenow="0"
                >

                    <div
                        id="persistentFill"
                        class="persistent-fill"
                    ></div>

                </div>

            </div>


        </section>



        <!-- =================================================
             HOLD / ICE OVERLAY
        ================================================== -->

        <section
            id="holdOverlay"
            class="hold-overlay"
            aria-hidden="true"
        >

            <div class="hold-panel">

                <div class="hold-icon">
                    ❄
                </div>

                <div class="hold-title">
                    ICE HOLD
                </div>

                <div
                    id="holdCountdown"
                    class="hold-countdown"
                >
                    30
                </div>

                <div class="hold-label">
                    SECONDS
                </div>


                <div
                    class="hold-progress"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                >

                    <div
                        id="holdProgressFill"
                        class="hold-progress-fill"
                    ></div>

                </div>


                <div
                    id="holdStatus"
                    class="hold-status"
                >
                    MACHINE FROZEN
                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="game-footer">

        <span>
            AMAZE GAMING
        </span>

        <span>
            ENGINE v8.0
        </span>

    </footer>



    <!-- =====================================================
         AMAZE GAMING v8 ENGINE
    ====================================================== -->

    <script
        src="amaze-engine-v8.js"
        defer
    ></script>


</body>
</html>
