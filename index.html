<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07000f"
    >

    <title>Amaze Escape</title>

    <link
        rel="stylesheet"
        href="amaze-style-v7.css"
    >

</head>


<body>

    <!-- ======================================================
         CASINO BACKGROUND
    ======================================================= -->

    <div
        id="casinoBackground"
        class="casino-background"
        aria-hidden="true"
    ></div>


    <!-- ======================================================
         SNOW / ICE EFFECT
    ======================================================= -->

    <div
        id="snowContainer"
        class="snow-container"
        aria-hidden="true"
    ></div>


    <!-- ======================================================
         ANTICIPATION OVERLAY
    ======================================================= -->

    <div
        id="anticipationOverlay"
        class="anticipation-overlay"
        aria-hidden="true"
    >

        <div class="anticipation-glow"></div>

        <div
            id="anticipationParticles"
            class="anticipation-particles"
        ></div>

        <div class="anticipation-content">

            <div class="anticipation-warning">
                🔥
            </div>

            <div class="anticipation-title">
                TWO MATCH!
            </div>

            <div class="anticipation-subtitle">
                FINAL REEL
            </div>

        </div>

    </div>


    <!-- ======================================================
         MAIN GAME
    ======================================================= -->

    <main class="game-wrapper">


        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="game-header">

            <div class="brand">

                <div class="brand-small">
                    AMAZE
                </div>

                <h1>
                    ESCAPE
                </h1>

            </div>


            <div
                id="roundStatus"
                class="round-status"
            >
                ROUND 1
            </div>

        </header>


        <!-- ==================================================
             MACHINE
        =================================================== -->

        <section
            id="machine"
            class="slot-machine"
            aria-label="Amaze Escape slot machine"
        >


            <!-- ==============================================
                 MACHINE TOP
            =============================================== -->

            <div class="machine-top">

                <div class="machine-title">
                    🎰 AMAZE ESCAPE 🎰
                </div>

                <div
                    id="jackpotLamp"
                    class="jackpot-lamp"
                >

                    <span class="lamp-light"></span>

                    <span class="lamp-text">
                        JACKPOT
                    </span>

                </div>

            </div>


            <!-- ==============================================
                 REELS AREA
            =============================================== -->

            <div class="reels-frame">


                <!-- LEFT LIGHT -->
                <div
                    class="reel-side-light left"
                    aria-hidden="true"
                ></div>


                <!-- ==========================================
                     REEL 1
                =========================================== -->

                <div
                    id="slot1"
                    class="reel"
                    aria-label="First reel"
                >
                    🍒
                </div>


                <!-- ==========================================
                     REEL 2
                =========================================== -->

                <div
                    id="slot2"
                    class="reel"
                    aria-label="Second reel"
                >
                    🍋
                </div>


                <!-- ==========================================
                     REEL 3 — FINAL REEL
                =========================================== -->

                <div
                    id="slot3"
                    class="reel final-reel"
                    aria-label="Final reel"
                >
                    ⭐
                </div>


                <!-- RIGHT LIGHT -->
                <div
                    class="reel-side-light right"
                    aria-hidden="true"
                ></div>


            </div>


            <!-- ==============================================
                 REEL STATUS
            =============================================== -->

            <div class="reel-status">

                <span class="status-dot"></span>

                <span>
                    THREE REELS
                </span>

                <span class="status-dot"></span>

            </div>


            <!-- ==============================================
                 MESSAGE
            =============================================== -->

            <div
                id="message"
                class="game-message"
                aria-live="polite"
            >
                READY
            </div>


            <!-- ==============================================
                 LEVER
            =============================================== -->

            <div
                class="lever-area"
                aria-hidden="true"
            >

                <div class="lever-base">

                    <div
                        class="real-lever"
                    >

                        <div class="lever-ball"></div>

                        <div class="lever-stick"></div>

                    </div>

                </div>

            </div>


            <!-- ==============================================
                 SPIN BUTTON
            =============================================== -->

            <button
                id="button"
                class="spin-button"
                type="button"
            >

                <span class="button-glow"></span>

                <span class="button-icon">
                    🎰
                </span>

                <span class="button-text">
                    SPIN
                </span>

            </button>


            <!-- ==============================================
                 SPIN PROGRESS
            =============================================== -->

            <div class="progress-section">

                <div class="progress-header">

                    <span>
                        ESCAPE PROGRESS
                    </span>

                    <strong id="counterValue">
                        0 / 100
                    </strong>

                </div>


                <div
                    id="spinProgress"
                    class="progress-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >

                    <div
                        id="spinProgressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- ==============================================
                 PERSISTENT REWARD
            =============================================== -->

            <div class="persistent-section">

                <div class="persistent-header">

                    <span class="persistent-icon">
                        💰
                    </span>

                    <span>
                        PERSISTENT PRIZE
                    </span>

                    <strong id="persistentValue">
                        0 / 10
                    </strong>

                </div>


                <div
                    id="persistentBar"
                    class="persistent-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="10"
                    aria-valuenow="0"
                >

                    <div
                        id="persistentFill"
                        class="persistent-fill"
                    ></div>

                </div>

            </div>


        </section>


        <!-- ==================================================
             HOLD / ICE OVERLAY
        =================================================== -->

        <div
            id="holdOverlay"
            class="hold-overlay"
            aria-hidden="true"
        >

            <div class="hold-backdrop"></div>


            <div class="hold-card">


                <div class="hold-icon">
                    ❄️
                </div>


                <div class="hold-title">
                    ICE HOLD
                </div>


                <div
                    id="holdStatus"
                    class="hold-status"
                >
                    MACHINE FROZEN
                </div>


                <div
                    id="holdCountdown"
                    class="hold-countdown"
                >
                    30
                </div>


                <div class="hold-seconds">
                    SECONDS
                </div>


                <div class="hold-progress">

                    <div
                        id="holdProgressFill"
                        class="hold-progress-fill"
                    ></div>

                </div>


                <div class="hold-message">
                    The machine is temporarily frozen.
                </div>


            </div>

        </div>


        <!-- ==================================================
             FOOTER
        =================================================== -->

        <footer class="game-footer">

            <span>
                AMAZE ESCAPE
            </span>

            <span>
                •
            </span>

            <span>
                ENGINE v7
            </span>

        </footer>


    </main>


    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script
        src="amaze-engine-v7.js"
        defer
    ></script>

</body>

</html>
