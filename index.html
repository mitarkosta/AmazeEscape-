<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Amaze Escape v8</title>

    <link
        <script src="script-v8.js"></script>
    >
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        id="casinoBackground"
        class="casino-background"
        aria-hidden="true"
    ></div>

    <div
        id="snowContainer"
        class="snow-container"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="game-page">

        <section
            id="machine"
            class="machine"
            aria-label="Amaze Escape slot machine"
        >

            <!-- =================================================
                 TOP HEADER
            ================================================== -->

            <header class="machine-header">

                <div class="brand">

                    <div class="brand-small">
                        AMAZE
                    </div>

                    <div class="brand-main">
                        ESCAPE
                    </div>

                    <div class="brand-version">
                        ENGINE v8
                    </div>

                </div>


                <div
                    id="jackpotLamp"
                    class="jackpot-lamp"
                    aria-hidden="true"
                >
                    <span></span>
                </div>

            </header>


            <!-- =================================================
                 ROUND / PROGRESS
            ================================================== -->

            <div class="status-panel">

                <div class="status-row">

                    <span
                        id="roundStatus"
                        class="round-status"
                    >
                        ROUND 1
                    </span>

                    <span
                        id="counterValue"
                        class="counter-value"
                    >
                        0 / 100
                    </span>

                </div>


                <div
                    id="spinProgress"
                    class="progress-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >

                    <div
                        id="spinProgressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- =================================================
                 SLOT WINDOW
            ================================================== -->

            <div class="slot-frame">

                <div class="slot-glass">

                    <div
                        id="slotsContainer"
                        class="slots-container"
                    >

                        <!-- REEL 1 -->

                        <div
                            id="slot1"
                            class="slot"
                            aria-label="Reel 1"
                        ></div>


                        <!-- REEL 2 -->

                        <div
                            id="slot2"
                            class="slot"
                            aria-label="Reel 2"
                        ></div>


                        <!-- REEL 3 -->

                        <div
                            id="slot3"
                            class="slot final-slot"
                            aria-label="Reel 3"
                        ></div>

                    </div>


                    <!-- CENTRAL PAYLINE -->

                    <div
                        class="payline"
                        aria-hidden="true"
                    ></div>


                    <!-- GLASS REFLECTION -->

                    <div
                        class="glass-reflection"
                        aria-hidden="true"
                    ></div>

                </div>

            </div>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            >
                READY
            </div>


            <!-- =================================================
                 PERSISTENT PROGRESS
            ================================================== -->

            <section class="persistent-panel">

                <div class="persistent-heading">

                    <span>
                        💰 PERSISTENT PRIZE
                    </span>

                    <strong id="persistentValue">
                        0 / 10
                    </strong>

                </div>


                <div
                    id="persistentBar"
                    class="persistent-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="10"
                    aria-valuenow="0"
                >

                    <div
                        id="persistentFill"
                        class="persistent-fill"
                    ></div>

                </div>

            </section>


            <!-- =================================================
                 CONTROL
            ================================================== -->

            <div class="controls">

                <button
                    id="button"
                    class="spin-button"
                    type="button"
                >

                    <span class="button-light"></span>

                    <span class="button-text">
                        SPIN
                    </span>

                </button>


                <div
                    class="real-lever"
                    aria-hidden="true"
                >

                    <div class="lever-top"></div>

                    <div class="lever-arm"></div>

                    <div class="lever-base"></div>

                </div>

            </div>


            <!-- =================================================
                 MACHINE FOOT
            ================================================== -->

            <div class="machine-footer">

                <span>
                    ★ AMAZE ESCAPE ★
                </span>

                <span>
                    100 SPINS
                </span>

            </div>

        </section>

    </main>


    <!-- =====================================================
         ANTICIPATION OVERLAY
    ====================================================== -->

    <div
        id="anticipationOverlay"
        class="anticipation-overlay"
        aria-hidden="true"
    >

        <div
            id="anticipationParticles"
            class="anticipation-particles"
        ></div>


        <div class="anticipation-content">

            <div class="anticipation-warning">
                🔥
            </div>

            <div class="anticipation-title">
                TWO MATCH
            </div>

            <div class="anticipation-subtitle">
                FINAL REEL
            </div>

            <div class="anticipation-line"></div>

            <div class="anticipation-pulse">
                ★ ★ ★
            </div>

        </div>

    </div>


    <!-- =====================================================
         HOLD OVERLAY
    ====================================================== -->

    <div
        id="holdOverlay"
        class="hold-overlay"
        aria-hidden="true"
    >

        <div class="hold-card">

            <div class="hold-icon">
                ❄
            </div>

            <div class="hold-title">
                ICE HOLD
            </div>

            <div
                id="holdStatus"
                class="hold-status"
            >
                MACHINE FROZEN
            </div>

            <div
                id="holdCountdown"
                class="hold-countdown"
            >
                30
            </div>

            <div class="hold-seconds">
                SECONDS
            </div>

            <div class="hold-progress">

                <div
                    id="holdProgressFill"
                    class="hold-progress-fill"
                ></div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
