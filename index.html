<script>

let attempts=0;

let attempts = 0;

const symbols=[
const symbols = [
"🍒",
"🍋",
"⭐",
"💎",
"7️⃣"
"7️⃣",
"🔔"
];


const machine = document.getElementById("machine");

const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");
const s3 = document.getElementById("s3");

const message = document.getElementById("message");

const attemptText = document.getElementById("attempt");

const button = document.getElementById("spinButton");

const story = document.getElementById("story");



/*
 Звуци чрез браузъра
*/

function sound(type){

let ctx = new AudioContext();

let osc = ctx.createOscillator();

let gain = ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type==="spin"){

osc.frequency.value=180;

gain.gain.value=.05;

osc.start();

osc.stop(ctx.currentTime+.08);

}



if(type==="near"){

osc.frequency.value=500;

gain.gain.value=.08;

osc.start();

osc.frequency.linearRampToValueAtTime(
800,
ctx.currentTime+.3
);

osc.stop(ctx.currentTime+.35);

}



if(type==="win"){

osc.frequency.value=700;

gain.gain.value=.1;

osc.start();

osc.frequency.linearRampToValueAtTime(
1200,
ctx.currentTime+.5
);

osc.stop(ctx.currentTime+.8);

}

}




function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}





function spin(){


attempts++;


let slots=[
document.getElementById("slot1"),
document.getElementById("slot2"),
document.getElementById("slot3")
];
attemptText.innerHTML=
"Attempt: " + attempts;


let message=document.getElementById("message");

sound("spin");

let button=document.querySelector("button");

machine.classList.add("shake");


slots.forEach(s=>{
setTimeout(()=>{

machine.classList.remove("shake");

},400);

s.classList.add("spin");

});

let slots=[
s1,
s2,
s3
];


let rounds=15;

let counter=0;
slots.forEach(slot=>{

slot.classList.add("spin");

});

let interval=setInterval(()=>{


slots.forEach(s=>{
let count=0;

s.innerHTML=randomSymbol();

let rolling=setInterval(()=>{


slots.forEach(slot=>{

slot.innerHTML=randomSymbol();

});


counter++;
count++;



if(counter>=rounds){
if(count>18){


clearInterval(interval);
clearInterval(rolling);


slots.forEach(s=>{

s.classList.remove("spin");
slots.forEach(slot=>{

slot.classList.remove("spin");

});


finish(slots,message,button);

result();



}


},100);



}



function finish(slots,message,button){


function result(){



/*
 След 100 натискания идва наградата
*/

if(attempts<3){

if(attempts>=100){

message.innerHTML="❌ Not this time...";
win();

return;

}



if(attempts===3){

let chance=Math.random();



/*
 Редки "почти печалби"
*/


if(chance<0.12){

slots[0].innerHTML="⭐";

slots[1].innerHTML="⭐";
let near=[
["⭐","⭐","🍋"],
["💎","💎","⭐"],
["7️⃣","7️⃣","🔔"],
["🍒","🍒","💎"]
];


let combo =
near[
Math.floor(Math.random()*near.length)
];


slots[2].innerHTML="💎";
s1.innerHTML=combo[0];
s2.innerHTML=combo[1];
s3.innerHTML=combo[2];


message.innerHTML=
"🔥 ALMOST WIN!";
"🔥 SO CLOSE... ONE SYMBOL AWAY";


return;
sound("near");


}

else{


message.innerHTML=randomMessages();

button.disabled=true;

}

slots[0].innerHTML="⭐";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";
}




function randomMessages(){


let texts=[

"❌ Not this time...",

"Almost...",

"That was close",

"You were so near",

"Maybe next spin",

"One more try",

"The jackpot is waiting",

"Just missed it",

"Nearly perfect",

"So close again",

"You almost had it",

"Don't stop now",

"The next one could be it",

"Only one symbol changed everything"

];


return texts[
Math.floor(Math.random()*texts.length)
];


}







function win(){



button.disabled=true;


s1.innerHTML="💰";
s2.innerHTML="⭐";
s3.innerHTML="💎";



message.innerHTML=
"🎲 So close...";
"🎉 JACKPOT! 🎉";


message.classList.add("jackpot");



sound("win");


createConfetti();



setTimeout(()=>{


document.getElementById("story").classList.add("show");
story.classList.add("show");


document.getElementById("story").innerHTML=
story.innerHTML=

`

<h2 style="color:#ffd700">
Why did you want to try again?
But why did you keep trying?
</h2>

<br>

You were close.
You didn't know when the reward would come.

<br><br>

Your brain expected a reward.
Every attempt created a new expectation.

<br><br>

The uncertainty kept you engaged.
The "almost win" made you believe the next try could be different.

<br><br>

<b>
This is variable reinforcement.
</b>

<br><br>

The uncertainty itself became the motivation.

`;

},2000);

},2500);



}





function createConfetti(){


for(let i=0;i<120;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=
[
"gold",
"red",
"blue",
"green",
"white"
]
[
Math.floor(Math.random()*5)
];



c.style.animationDelay=
Math.random()*2+"s";



document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}



}
