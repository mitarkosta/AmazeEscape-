<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmazeEscape 🎰</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle,#990000,#050505 75%);

}



/* фон със светлини */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    radial-gradient(#ffd700 2px,transparent 2px);

    background-size:45px 45px;

    opacity:.2;

    animation:
    stars 15s linear infinite;

}



@keyframes stars{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(100px);
    }

}



/* слот машина */


.machine{

    position:relative;

    z-index:2;

    width:min(95%,520px);

    padding:35px;

    border-radius:35px;


    background:
    linear-gradient(145deg,#222,#050505);


    border:6px solid gold;


    text-align:center;


    box-shadow:

    0 0 30px gold,
    0 0 80px orange,
    inset 0 0 40px black;


}




h1{


    margin:0;


    font-size:55px;


    color:#ffd700;


    text-shadow:

    0 0 10px white,
    0 0 40px orange;


}




.subtitle{


    color:white;


    margin-top:10px;


    letter-spacing:6px;


    font-size:18px;


}




/* екран */


.display{


    margin-top:30px;


    padding:25px;


    background:black;


    border-radius:20px;


    border:4px solid #555;


    box-shadow:

    inset 0 0 30px black;


}





.slots{


    display:flex;


    justify-content:center;


    gap:12px;


}




.slot{


    width:95px;

    height:95px;


    display:flex;


    justify-content:center;

    align-items:center;


    font-size:55px;


    background:

    linear-gradient(#333,#111);


    border:3px solid gold;


    border-radius:18px;


    box-shadow:

    0 0 15px gold;


}




/* въртене */


.spin{


    animation:

    spin .12s infinite;


}



@keyframes spin{


    50%{

        transform:

        translateY(15px);

        filter:blur(2px);

    }


}





button{


    margin-top:30px;


    padding:18px 55px;


    border:0;


    border-radius:50px;


    font-size:25px;


    font-weight:bold;


    cursor:pointer;


    background:

    linear-gradient(#ffe878,#cc9900);


    box-shadow:

    0 0 30px gold;


}





button:hover{


    transform:scale(1.08);


}



button:disabled{


    opacity:.5;


}




#message{


    margin-top:25px;


    height:45px;


    color:white;


    font-size:30px;


}





.win{


    animation:

    winner .6s infinite;


}




@keyframes winner{


    50%{

        transform:scale(1.25);

    }


}




#stats{


    margin-top:15px;


    color:#aaa;


    font-size:18px;


}





/* конфети */


.confetti{


    position:absolute;


    width:12px;


    height:20px;


    top:-20px;


    animation:

    fall 3s linear forwards;


}




@keyframes fall{


    to{


        transform:

        translateY(110vh)

        rotate(720deg);


    }


}





@media(max-width:500px){


h1{

font-size:42px;

}


.slot{

width:75px;

height:75px;

font-size:40px;

}


.machine{

padding:25px;

}


}



</style>

</head>



<body>


<!-- AmazeEscape Slot Machine -->


<div class="machine">


<h1>
AmazeEscape
</h1>


<div class="subtitle">
TRY YOUR LUCK
</div>



<div class="display">


<div class="slots">


<div class="slot" id="slot1">
🍒
</div>


<div class="slot" id="slot2">
⭐
</div>

💎
</div>


</div>

🎰 SPIN

Attempts:

</span>

</div>



</div>



<!--
=====================================
ТУК СЕ ПОСТАВЯ ЧАСТ 2
JavaScript кодът започва тук
=====================================
-->
<script>


const symbols = [
    "🍒",
    "🍋",
    "⭐",
    "💎",
    "🔔",
    "7️⃣"
];


const slot1 = document.getElementById("slot1");
const slot2 = document.getElementById("slot2");
const slot3 = document.getElementById("slot3");


const button = document.getElementById("spinButton");

const message = document.getElementById("message");

const attemptsText = document.getElementById("attempts");



let attempts = 0;

let audioContext = null;



// звуци

function sound(freq, duration){

    try{

        if(!audioContext){

            audioContext = new AudioContext();

        }


        let osc =
        audioContext.createOscillator();


        let gain =
        audioContext.createGain();



        osc.frequency.value = freq;

        gain.gain.value = 0.08;



        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );


        osc.start();


        osc.stop(
            audioContext.currentTime + duration
        );


    }

    catch(e){}

}





function randomSymbol(){

    return symbols[
        Math.floor(
            Math.random()*symbols.length
        )
    ];

}





function spin(){


    button.disabled = true;


    attempts++;

    attemptsText.innerHTML =
    attempts;



    message.className = "";

    message.innerHTML =
    "🎰 Spinning...";


    sound(200,0.1);



    let slots = [
        slot1,
        slot2,
        slot3
    ];



    slots.forEach(slot=>{

        slot.classList.add("spin");

    });



    let counter = 0;



    let animation =
    setInterval(()=>{


        slots.forEach(slot=>{

            slot.innerHTML =
            randomSymbol();

        });



        counter++;



        if(counter >= 25){


            clearInterval(animation);


            stopSlots(slots);


        }



    },100);



}






function stopSlots(slots){


    let result = [];



    slots.forEach((slot,index)=>{


        setTimeout(()=>{


            slot.classList.remove("spin");



            slot.innerHTML =
            randomSymbol();



            result[index] =
            slot.innerHTML;



            sound(
                300 + index*100,
                0.15
            );



            if(index === 2){


                checkWin(result);


            }



        },600 + index*500);



    });



}







function checkWin(result){



    button.disabled = false;



    if(

        result[0] === result[1] &&

        result[1] === result[2]

    ){



        message.innerHTML =
        "🎉 JACKPOT! 🎉";


        message.className =
        "win";



        sound(900,0.5);



        createConfetti();



    }



    else if(

        result[0] === result[1] ||

        result[1] === result[2] ||

        result[0] === result[2]

    ){



        message.innerHTML =
        "🔥 ALMOST WIN!";


        sound(500,0.3);



    }



    else{


        message.innerHTML =
        "❌ Try again";

        sound(250,0.2);


    }



}








function createConfetti(){



    for(let i=0;i<100;i++){



        let c =
        document.createElement("div");



        c.className =
        "confetti";



        c.style.left =
        Math.random()*100+"vw";



        let colors = [

            "gold",
            "red",
            "blue",
            "green",
            "purple"

        ];



        c.style.background =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];



        c.style.animationDelay =
        Math.random()*1+"s";



        document.body.appendChild(c);




        setTimeout(()=>{

            c.remove();

        },4000);



    }



}







button.onclick = spin;



</script>

    <script>


// ================================
// AmazeEscape Upgrade Pack
// Баланс + залози + печалби
// ================================


let balance = 
localStorage.getItem("amazeBalance")
?
Number(localStorage.getItem("amazeBalance"))
:
1000;


let bet =
localStorage.getItem("amazeBet")
?
Number(localStorage.getItem("amazeBet"))
:
10;



// създаваме панела

">

</div>

machine.appendChild(upgrade);




const balanceText =
document.getElementById("balance");


const betText =
document.getElementById("bet");



document.getElementById("minus")
.onclick=function(){


if(bet>10){

bet-=10;

updateMoney();

}

};



document.getElementById("plus")
.onclick=function(){


if(bet<100){

bet+=10;

updateMoney();

}

};




function updateMoney(){


balanceText.innerHTML =
balance;


betText.innerHTML =
bet;


localStorage.setItem(
"amazeBalance",
balance
);


localStorage.setItem(
"amazeBet",
bet
);

// запазване на оригиналната функция

const oldSpin =
spin;




spin=function(){



if(balance < bet){


message.innerHTML =
"💸 Нямаш достатъчно кредити";


return;

}



balance -= bet;


updateMoney();


oldSpin();


};






// награди


const oldCheckWin =
checkWin;




checkWin=function(result){



oldCheckWin(result);



setTimeout(()=>{


let multiplier=0;



if(
result[0]=="7️⃣" &&
result[1]=="7️⃣" &&
result[2]=="7️⃣"
){

multiplier=100;

}


else if(

result.every(x=>x=="💎")

){

multiplier=50;

}


else if(

result.every(x=>x=="⭐")

){

multiplier=25;

}


else if(

result[0]===result[1] &&
result[1]===result[2]

){

multiplier=10;

}



else if(

result[0]===result[1] ||
result[1]===result[2] ||
result[0]===result[2]

){

multiplier=2;

}



if(multiplier>0){


let win =
bet * multiplier;



balance += win;


updateMoney();



message.innerHTML +=

"<br>💰 WIN +" + win;


sound(1000,.5);



}



},200);



};





updateMoney();
