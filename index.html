<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>
        AMAZE GAMING — Amaze Escape v7.1
    </title>

    <!-- =====================================================
         AMAZE GAMING v7.1 STYLE
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./amaze-style-v7.1.css"
    >

</head>

<body>

    <!-- =====================================================
         CASINO BACKGROUND
    ====================================================== -->

    <div
        id="casinoBackground"
        class="casino-background"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         ANTICIPATION OVERLAY
    ====================================================== -->

    <div
        id="anticipationOverlay"
        class="anticipation-overlay"
        aria-hidden="true"
    >

        <div class="anticipation-title">
            🔥 FINAL REEL
        </div>

        <div class="anticipation-subtitle">
            TWO MATCH
        </div>

        <div
            id="anticipationParticles"
            class="anticipation-particles"
        ></div>

    </div>


    <!-- =====================================================
         ICE HOLD OVERLAY
    ====================================================== -->

    <div
        id="holdOverlay"
        class="hold-overlay"
        aria-hidden="true"
    >

        <div class="ice-crystal">
            ❄
        </div>

        <div class="hold-title">
            ICE HOLD
        </div>

        <div
            id="holdCountdown"
            class="hold-countdown"
        >
            30
        </div>

        <div class="hold-seconds">
            SECONDS
        </div>

        <div
            id="holdProgress"
            class="hold-progress"
        >
            <div
                id="holdProgressFill"
                class="hold-progress-fill"
            ></div>
        </div>

        <div
            id="holdStatus"
            class="hold-status"
        >
            MACHINE FROZEN
        </div>

    </div>


    <!-- =====================================================
         SNOW
    ====================================================== -->

    <div
        id="snowContainer"
        class="snow-container"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN GAME
    ====================================================== -->

    <main class="game-wrapper">

        <section
            id="machine"
            class="slot-machine"
        >

            <!-- =================================================
                 MACHINE HEADER
            ================================================== -->

            <header class="machine-header">

                <div class="brand-fire">
                    🔥
                </div>

                <div class="brand">

                    <div class="brand-name">
                        AMAZE
                    </div>

                    <div class="brand-name accent">
                        GAMING
                    </div>

                </div>

                <div class="version">
                    v7.1
                </div>

            </header>


            <!-- =================================================
                 JACKPOT LAMP
            ================================================== -->

            <div
                id="jackpotLamp"
                class="jackpot-lamp"
            >
                <span></span>
                JACKPOT
            </div>


            <!-- =================================================
                 ROUND / PROGRESS
            ================================================== -->

            <div class="game-info">

                <div
                    id="roundStatus"
                    class="round-status"
                >
                    ROUND 1
                </div>

                <div class="spin-counter">

                    <span>
                        SPINS
                    </span>

                    <strong id="counterValue">
                        0 / 100
                    </strong>

                </div>

            </div>


            <div
                id="spinProgress"
                class="spin-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >

                <div
                    id="spinProgressFill"
                    class="spin-progress-fill"
                ></div>

            </div>


            <!-- =================================================
                 REALISTIC REEL AREA
            ================================================== -->

            <section class="reel-stage">

                <div class="reel-frame">

                    <!-- LEFT METAL SEPARATOR -->

                    <div class="metal-separator left"></div>


                    <!-- REEL 1 -->

                    <div
                        id="reel1"
                        class="reel-window"
                    >

                        <div
                            id="slot1"
                            class="reel"
                        ></div>

                    </div>


                    <!-- SEPARATOR 1 -->

                    <div class="metal-separator"></div>


                    <!-- REEL 2 -->

                    <div
                        id="reel2"
                        class="reel-window"
                    >

                        <div
                            id="slot2"
                            class="reel"
                        ></div>

                    </div>


                    <!-- SEPARATOR 2 -->

                    <div class="metal-separator"></div>


                    <!-- REEL 3 -->

                    <div
                        id="reel3"
                        class="reel-window"
                    >

                        <div
                            id="slot3"
                            class="reel"
                        ></div>

                    </div>


                    <!-- RIGHT METAL SEPARATOR -->

                    <div class="metal-separator right"></div>


                    <!-- CENTER WIN LINE -->

                    <div
                        class="payline"
                        aria-hidden="true"
                    ></div>

                </div>

            </section>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            >
                READY
            </div>


            <!-- =================================================
                 LEVER
            ================================================== -->

            <div class="lever-area">

                <div class="lever-base">

                    <div class="real-lever">

                        <div class="lever-ball"></div>

                        <div class="lever-arm"></div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 SPIN BUTTON
            ================================================== -->

            <button
                id="button"
                class="spin-button"
                type="button"
            >
                SPIN
            </button>


            <!-- =================================================
                 PERSISTENT REWARD
            ================================================== -->

            <section class="persistent-panel">

                <div class="persistent-title">
                    💰 PERSISTENT REWARD
                </div>

                <div
                    id="persistentValue"
                    class="persistent-value"
                >
                    0 / 10
                </div>

                <div
                    id="persistentBar"
                    class="persistent-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="10"
                    aria-valuenow="0"
                >

                    <div
                        id="persistentFill"
                        class="persistent-fill"
                    ></div>

                </div>

            </section>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <footer class="machine-footer">

                AMAZE GAMING
                <span>•</span>
                ESCAPE ENGINE v7.1

            </footer>

        </section>

    </main>


    <!-- =====================================================
         ENGINE v7.1
    ====================================================== -->

    <script
        src="./amaze-engine-v7.1.js"
        defer
    ></script>

</body>

</html>
